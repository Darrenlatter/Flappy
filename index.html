<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
    body {
        font-family: 'Consolas', monospace;
        background-color: #2c3e50;
        color: white;
        text-align: center;
        margin-top: 20px;
    }
    canvas {
        border: 4px solid #34495e;
        border-radius: 8px;
        background-color: #f1f1f1;
        /* Fixed missing semicolon in original CSS */
        background-image: url('background.jpg'); 
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
    }
    button {
        background-color: #e74c3c;
        color: white;
        border: none;
        padding: 15px 32px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        box-shadow: 0 4px #c0392b;
        margin: 10px;
    }
    button:active {
        box-shadow: 0 2px #c0392b;
        transform: translateY(2px);
    }
</style>
</head>
<body onload="startGame()">

<div id="game-container"></div>

<br>
<button onmousedown="accelerate(GAME_CONFIG.playerBoost)" onmouseup="accelerate(GAME_CONFIG.playerGravity)">ACCELERATE</button>
<p>Use the ACCELERATE button to stay in the air!</p>
<p>How long can you stay alive?</p>

<script>
// =========================================================================
// SCOUT EDIT ZONE: Change these values to customize your game!
// =========================================================================
const GAME_CONFIG = {
    // Canvas dimensions
    canvasWidth: 960,
    canvasHeight: 540,

    // Game Physics
    playerGravity: 0.05,     // How fast the player falls (higher = heavier)
    playerBoost: -0.2,       // How strong the button push is (more negative = higher jump)
    obstacleSpeed: -2,       // How fast obstacles move left (negative numbers move left)
    spawnRate: 150,          // How often a new obstacle appears (lower = more frequent)

    // Gap spacing rules
    minGap: 80,              // Smallest possible gap between top and bottom obstacles
    maxGap: 200,             // Largest possible gap between top and bottom obstacles
    minObstacleHeight: 20,   // Shortest an obstacle can be
    maxObstacleHeight: 200,  // Tallest an obstacle can be

    // Sprite Asset Customization
    // (If these files don't exist in the same folder, the game falls back to the colors below!)
    useSprites: true,                    // Change to false to only use flat colors
    playerSpriteUrl: "player.png",       // e.g., a scout badge, a tent, an astronaut
    topObstacleSpriteUrl: "stalactite.png", // e.g., a log, a cloud, a lightning bolt
    botObstacleSpriteUrl: "stalagmite.png", // e.g., a campfire, a tree, a mountain

    // Fallback Colors (Used if useSprites is false, or images fail to load)
    playerColor: "#e74c3c",      // Red
    obstacleColor: "#2ecc71",    // Green
    textColor: "#ffffff"         // White
};
// =========================================================================

var myGamePiece;
var myObstacles = [];
var myScore;

// Preload Image helper
function createGameImage(src) {
    var img = new Image();
    img.src = src;
    return img;
}

// Load assets globally
var playerImg = createGameImage(GAME_CONFIG.playerSpriteUrl);
var topObstacleImg = createGameImage(GAME_CONFIG.topObstacleSpriteUrl);
var botObstacleImg = createGameImage(GAME_CONFIG.botObstacleSpriteUrl);

function startGame() {
    // Player starts at x: 10, y: 120, sized 40x40 pixels
    myGamePiece = new component(40, 40, GAME_CONFIG.playerColor, 10, 120, "player");
    myGamePiece.gravity = GAME_CONFIG.playerGravity;
    
    // Score display configuration
    myScore = new component("30px", "Consolas", GAME_CONFIG.textColor, 30, 40, "text");
    myGameArea.start();
}

var myGameArea = {
    canvas : document.createElement("canvas"),
    start : function() {
        this.canvas.width = GAME_CONFIG.canvasWidth;
        this.canvas.height = GAME_CONFIG.canvasHeight;
        this.context = this.canvas.getContext("2d");
        
        var container = document.getElementById("game-container");
        container.appendChild(this.canvas);
        
        this.frameNo = 0;
        this.interval = setInterval(updateGameArea, 20);
    },
    clear : function() {
        this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
    }
}

function component(width, height, color, x, y, type) {
    this.type = type;
    this.score = 0;
    this.width = width;
    this.height = height;
    this.speedX = 0;
    this.speedY = 0;    
    this.x = x;
    this.y = y;
    this.gravity = 0;
    this.gravitySpeed = 0;
    
    this.update = function() {
        ctx = myGameArea.context;
        
        if (this.type == "text") {
            ctx.font = this.width + " " + this.height;
            ctx.fillStyle = color;
            ctx.fillText(this.text, this.x, this.y);
        } 
        else if (GAME_CONFIG.useSprites) {
            // Draw sprite graphics if available
            try {
                if (this.type === "player") {
                    ctx.drawImage(playerImg, this.x, this.y, this.width, this.height);
                } else if (this.type === "topObstacle") {
                    ctx.drawImage(topObstacleImg, this.x, this.y, this.width, this.height);
                } else if (this.type === "botObstacle") {
                    ctx.drawImage(botObstacleImg, this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = color;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            } catch(e) {
                // Fallback to shapes if image rendering errors out
                ctx.fillStyle = color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        } 
        else {
            // Standard shape fallback
            ctx.fillStyle = color;
            ctx.fillRect(this.x, this.y, this.width, this.height);
        }
    }
    
    this.newPos = function() {
        this.gravitySpeed += this.gravity;
        this.x += this.speedX;
        this.y += this.speedY + this.gravitySpeed;
        this.hitBottom();
        this.hitTop();
    }
    
    this.hitBottom = function() {
        var rockbottom = myGameArea.canvas.height - this.height;
        if (this.y > rockbottom) {
            this.y = rockbottom;
            this.gravitySpeed = 0;
        }
    }

    this.hitTop = function() {
        if (this.y < 0) {
            this.y = 0;
            this.gravitySpeed = 0;
        }
    }
    
    this.crashWith = function(otherobj) {
        var myleft = this.x;
        var myright = this.x + (this.width);
        var mytop = this.y;
        var mybottom = this.y + (this.height);
        var otherleft = otherobj.x;
        var otherright = otherobj.x + (otherobj.width);
        var othertop = otherobj.y;
        var otherbottom = otherobj.y + (otherobj.height);
        var crash = true;
        if ((mybottom < othertop) || (mytop > otherbottom) || (myright < otherleft) || (myleft > otherright)) {
            crash = false;
        }
        return crash;
    }
}

function updateGameArea() {
    var x, height, gap, minHeight, maxHeight, minGap, maxGap;
    for (i = 0; i < myObstacles.length; i += 1) {
        if (myGamePiece.crashWith(myObstacles[i])) {
            return; // Game Over
        } 
    }
    myGameArea.clear();
    myGameArea.frameNo += 1;
    
    if (myGameArea.frameNo == 1 || everyinterval(GAME_CONFIG.spawnRate)) {
        x = myGameArea.canvas.width;
        minHeight = GAME_CONFIG.minObstacleHeight;
        maxHeight = GAME_CONFIG.maxObstacleHeight;
        height = Math.floor(Math.random()*(maxHeight-minHeight+1)+minHeight);
        
        minGap = GAME_CONFIG.minGap;
        maxGap = GAME_CONFIG.maxGap;
        gap = Math.floor(Math.random()*(maxGap-minGap+1)+minGap);
        
        // Width of obstacles is set to 30px here for a chunkier sprite look
        myObstacles.push(new component(30, height, GAME_CONFIG.obstacleColor, x, 0, "topObstacle"));
        myObstacles.push(new component(30, x - height - gap, GAME_CONFIG.obstacleColor, x, height + gap, "botObstacle"));
    }
    
    for (i = 0; i < myObstacles.length; i += 1) {
        myObstacles[i].x += GAME_CONFIG.obstacleSpeed;
        myObstacles[i].update();
    }
    
    myScore.text = "SCORE: " + myGameArea.frameNo;
    myScore.update();
    myGamePiece.newPos();
    myGamePiece.update();
}

function everyinterval(n) {
    if ((myGameArea.frameNo / n) % 1 == 0) {return true;}
    return false;
}

function accelerate(n) {
    myGamePiece.gravity = n;
}
</script>
</body>
</html>
