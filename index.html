<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
    body {
        font-family: 'Consolas', monospace;
        background-color: #2c3e50;
        color: white;
        text-align: center;
        margin-top: 20px;
    }
    canvas {
        border: 4px solid #34495e;
        border-radius: 8px;
        background-color: #34495e; 
        box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        display: block;
        margin: 0 auto;
    }
    button {
        background-color: #e74c3c;
        color: white;
        border: none;
        padding: 15px 32px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        box-shadow: 0 4px #c0392b;
        margin: 20px;
    }
    button:active {
        box-shadow: 0 2px #c0392b;
        transform: translateY(2px);
    }
</style>
</head>
<body onload="startGame()">

<div id="game-container"></div>

<button onmousedown="accelerate(GAME_CONFIG.playerBoost)" onmouseup="accelerate(GAME_CONFIG.playerGravity)">ACCELERATE</button>
<p>Use the ACCELERATE button to stay in the air!</p>
<p>How long can you stay alive?</p>

<script>
// =========================================================================
// SCOUT EDIT ZONE: Change these values to customize your game!
// =========================================================================
const GAME_CONFIG = {
    canvasWidth: 960,
    canvasHeight: 540,

    // Game Physics
    playerGravity: 0.05,     
    playerBoost: -0.2,       
    obstacleSpeed: -2,       
    spawnRate: 150,          

    // Gap spacing rules
    minGap: 100,              
    maxGap: 220,             
    minObstacleHeight: 40,   
    maxObstacleHeight: 220,  

    // Sprite Asset Customization
    useSprites: true,                    
    playerSpriteUrl: "player.png",       
    topObstacleSpriteUrl: "stalactite.png", 
    botObstacleSpriteUrl: "stalagmite.png", 
    backgroundUrl: "background.jpg",

    // Fallback Colors (Used if useSprites is false OR images fail to load)
    playerColor: "#e74c3c",      
    obstacleColor: "#2ecc71",    
    textColor: "#ffffff"         
};
// =========================================================================

var myGamePiece;
var myObstacles = [];
var myScore;

// Safely build Image objects
var playerImg = new Image(); playerImg.src = GAME_CONFIG.playerSpriteUrl;
var topObstacleImg = new Image(); topObstacleImg.src = GAME_CONFIG.topObstacleSpriteUrl;
var botObstacleImg = new Image(); botObstacleImg.src = GAME_CONFIG.botObstacleSpriteUrl;
var bgImg = new Image(); bgImg.src = GAME_CONFIG.backgroundUrl;

// Runtime pattern cache
var topPattern = null;
var botPattern = null;

function startGame() {
    myGameArea.start();
    
    // Create elements AFTER canvas setup to ensure contexts exist
    myGamePiece = new component(40, 40, GAME_CONFIG.playerColor, 10, 120, "player");
    myGamePiece.gravity = GAME_CONFIG.playerGravity;
    
    myScore = new component("30px", "Consolas", GAME_CONFIG.textColor, 30, 40, "text");
}

var myGameArea = {
    canvas : document.createElement("canvas"),
    start : function() {
        this.canvas.width = GAME_CONFIG.canvasWidth;
        this.canvas.height = GAME_CONFIG.canvasHeight;
        this.context = this.canvas.getContext("2d");
        
        var container = document.getElementById("game-container");
        container.appendChild(this.canvas);
        
        this.frameNo = 0;
        
        if (this.interval) clearInterval(this.interval);
        this.interval = setInterval(updateGameArea, 20);
    },
    clear : function() {
        this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
    }
}

function component(width, height, color, x, y, type) {
    this.type = type;
    this.width = width;
    this.height = height;
    this.x = x;
    this.y = y;
    this.gravity = 0;
    this.gravitySpeed = 0;
    
    this.update = function() {
        var ctx = myGameArea.context;
        
        if (this.type == "text") {
            ctx.font = this.width + " " + this.height;
            ctx.fillStyle = color;
            ctx.fillText(this.text, this.x, this.y);
            return;
        } 

        if (GAME_CONFIG.useSprites) {
            try {
                if (this.type === "player" && playerImg.complete && playerImg.naturalWidth !== 0) {
                    ctx.drawImage(playerImg, this.x, this.y, this.width, this.height);
                    return;
                } 
                else if (this.type === "topObstacle" && topObstacleImg.complete && topObstacleImg.naturalWidth !== 0) {
                    // FIX: Ensure pattern layout repeats cleanly relative to moving components
                    topPattern = ctx.createPattern(topObstacleImg, 'repeat');
                    ctx.save();
                    ctx.fillStyle = topPattern;
                    ctx.translate(this.x, this.y);
                    ctx.fillRect(0, 0, this.width, this.height);
                    ctx.restore();
                    return;
                } 
                else if (this.type === "botObstacle" && botObstacleImg.complete && botObstacleImg.naturalWidth !== 0) {
                    // FIX: Re-verify pattern handling inside live loop context
                    botPattern = ctx.createPattern(botObstacleImg, 'repeat');
                    ctx.save();
                    ctx.fillStyle = botPattern;
                    ctx.translate(this.x, this.y);
                    ctx.fillRect(0, 0, this.width, this.height);
                    ctx.restore();
                    return;
                }
            } catch (e) {
                // Silently drop down to vector fallback if asset patterns fail to register
            }
        }
        
        ctx.fillStyle = color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
    }
    
    this.newPos = function() {
        this.gravitySpeed += this.gravity;
        this.x += this.speedX || 0;
        this.y += (this.speedY || 0) + this.gravitySpeed;
        this.hitBottom();
        this.hitTop();
    }
    
    this.hitBottom = function() {
        var rockbottom = myGameArea.canvas.height - this.height;
        if (this.y > rockbottom) {
            this.y = rockbottom;
            this.gravitySpeed = 0;
        }
    }

    this.hitTop = function() {
        if (this.y < 0) {
            this.y = 0;
            this.gravitySpeed = 0;
        }
    }
    
    this.crashWith = function(otherobj) {
        var myleft = this.x;
        var myright = this.x + (this.width);
        var mytop = this.y;
        var mybottom = this.y + (this.height);
        var otherleft = otherobj.x;
        var otherright = otherobj.x + (otherobj.width);
        var othertop = otherobj.y;
        var otherbottom = otherobj.y + (otherobj.height);
        var crash = true;
        if ((mybottom < othertop) || (mytop > otherbottom) || (myright < otherleft) || (myleft > otherright)) {
            crash = false;
        }
        return crash;
    }
}

function updateGameArea() {
    var ctx = myGameArea.context;
    
    for (var i = 0; i < myObstacles.length; i++) {
        if (myGamePiece.crashWith(myObstacles[i])) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 0, myGameArea.canvas.width, myGameArea.canvas.height);
            ctx.font = "50px Consolas";
            ctx.fillStyle = "red";
            ctx.fillText("GAME OVER", myGameArea.canvas.width/2 - 130, myGameArea.canvas.height/2);
            clearInterval(myGameArea.interval);
            return; 
        } 
    }
    
    myGameArea.clear();
    myGameArea.frameNo += 1;
    
    if (GAME_CONFIG.useSprites && bgImg.complete && bgImg.naturalWidth !== 0) {
        ctx.drawImage(bgImg, 0, 0, myGameArea.canvas.width, myGameArea.canvas.height);
    }
    
    if (myGameArea.frameNo == 1 || everyinterval(GAME_CONFIG.spawnRate)) {
        var x = myGameArea.canvas.width;
        var minHeight = GAME_CONFIG.minObstacleHeight;
        var maxHeight = GAME_CONFIG.maxObstacleHeight;
        var height = Math.floor(Math.random()*(maxHeight-minHeight+1)+minHeight);
        
        var minGap = GAME_CONFIG.minGap;
        var maxGap = GAME_CONFIG.maxGap;
        var gap = Math.floor(Math.random()*(maxGap-minGap+1)+minGap);
        
        myObstacles.push(new component(40, height, GAME_CONFIG.obstacleColor, x, 0, "topObstacle"));
        myObstacles.push(new component(40, myGameArea.canvas.height - height - gap, GAME_CONFIG.obstacleColor, x, height + gap, "botObstacle"));
    }
    
    for (var i = 0; i < myObstacles.length; i++) {
        myObstacles[i].x += GAME_CONFIG.obstacleSpeed;
        myObstacles[i].update();
    }
    
    myScore.text = "SCORE: " + myGameArea.frameNo;
    myScore.update();
    myGamePiece.newPos();
    myGamePiece.update();
}

function everyinterval(n) {
    if ((myGameArea.frameNo / n) % 1 == 0) {return true;}
    return false;
}

function accelerate(n) {
    if(myGamePiece) {
        myGamePiece.gravity = n;
    }
}
</script>
</body>
</html>
